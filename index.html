<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 翻译文章收藏夹</title>
<style>
    :root {
        --bg: #f9f9f9; --card-bg: #ffffff; --text-main: #1f1f1f;
        --text-sub: #7b7b7b; --accent: #4f46e5; --border: #e5e5e5; --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 280px; background: var(--card-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; transition: transform 0.3s ease; z-index: 100; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sidebar h2 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .sidebar h2::before { content: "#"; color: var(--text-sub); font-size: 22px; }
    .close-sidebar { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-sub); }
    .tag-list { list-style: none; padding: 0; margin: 0; flex: 1; }
    .tag-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; font-size: 15px; }
    .tag-item:hover { background: #f0f0f0; }
    .tag-item.active { background: var(--accent); color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 20px 30px; overflow-y: auto; }
    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
    .main-header h1 { font-size: 24px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .main-header h1::before { content: "#"; color: var(--text-sub); }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: #f0f0ff; }
    .btn-danger { background: var(--danger); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .editor-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .input-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .input-tab { padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; background: #fff; transition: 0.2s; }
    .input-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .input-area { display: none; margin-bottom: 15px; }
    .input-area.active { display: block; }
    .input-area textarea, .input-area input[type="text"] { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 15px; font-family: inherit; outline: none; resize: vertical; min-height: 80px; }
    .input-area input[type="file"] { display: block; margin-top: 10px; }
    .input-area img.preview { max-width: 200px; margin-top: 10px; border-radius: 8px; display: none; }
    .editor-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 15px; flex-wrap: wrap; gap: 10px; }
    .result-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
    .result-card h3 { margin: 0 0 10px 0; font-size: 18px; }
    .result-card .original { color: var(--text-sub); font-size: 14px; margin-bottom: 15px; border-left: 3px solid var(--border); padding-left: 10px; }
    .result-card .translated { font-size: 16px; line-height: 1.6; white-space: pre-wrap; background: #f8f8f8; padding: 15px; border-radius: 8px; }
    .save-section { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .save-section input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .article-list { display: flex; flex-direction: column; gap: 15px; }
    .article-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .article-item .title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .article-item .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
    .article-item .tag { background: #eef2ff; color: var(--accent); padding: 3px 10px; border-radius: 12px; font-size: 12px; }
    .article-item .translated-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; max-height: 200px; overflow: hidden; text-overflow: ellipsis; }
    .article-item .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    .empty-tip { text-align: center; color: var(--text-sub); padding: 40px; }
    @media (max-width: 768px) {
        .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar.open { transform: translateX(0); }
        .close-sidebar { display: block; }
        .menu-btn { display: block; }
        .main { padding: 15px; }
    }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>标签索引</h2>
        <button class="close-sidebar" id="close-sidebar">×</button>
    </div>
    <ul class="tag-list" id="tag-list">
        <li class="tag-item active" data-tag="all">📚 全部文章</li>
    </ul>
</div>

<div class="main">
    <div class="main-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <button class="menu-btn" id="menu-btn">☰</button>
            <h1 id="page-title">全部文章</h1>
        </div>
        <button class="btn btn-outline btn-sm" id="settings-btn">⚙️ AI 配置</button>
    </div>

    <div class="editor-card">
        <div class="input-tabs">
            <div class="input-tab active" data-type="text">📝 输入文本</div>
            <div class="input-tab" data-type="image">🖼️ 上传截图</div>
            <div class="input-tab" data-type="url">🌐 输入网址</div>
            <div class="input-tab" data-type="file">📄 上传文件</div>
        </div>

        <div class="input-area active" id="area-text">
            <textarea id="input-text" placeholder="在此粘贴你想翻译的外文文章..."></textarea>
        </div>
        <div class="input-area" id="area-image">
            <input type="file" id="input-image" accept="image/*">
            <img class="preview" id="image-preview">
            <p style="font-size:12px;color:var(--text-sub);margin-top:5px;">* 支持中、韩、英等多语言混合识别，首次使用需加载语言包</p>
        </div>
        <div class="input-area" id="area-url">
            <input type="text" id="input-url" placeholder="输入网址，例如 https://example.com/article">
            <p style="font-size:12px;color:var(--text-sub);margin-top:5px;">* 部分网站有反爬机制，可能无法抓取，可尝试复制文本手动输入</p>
        </div>
        <div class="input-area" id="area-file">
            <input type="file" id="input-file" accept=".txt,.md">
            <p style="font-size:12px;color:var(--text-sub);margin-top:5px;">* 目前仅支持纯文本 (.txt) 和 Markdown (.md) 文件</p>
        </div>

        <div class="editor-actions">
            <span id="status-msg" style="font-size:13px; color:var(--accent);"></span>
            <button class="btn" id="translate-btn">开始 AI 翻译</button>
        </div>
    </div>

    <div class="result-card" id="result-card">
        <h3>翻译结果</h3>
        <div class="original" id="result-original"></div>
        <div class="translated" id="result-translated"></div>
        <div class="save-section">
            <input type="text" id="save-tags" placeholder="输入标签，用逗号分隔，例如：科技,历史">
            <button class="btn" id="save-article-btn">保存到收藏夹</button>
            <button class="btn btn-outline" id="clear-result-btn">清空</button>
        </div>
    </div>

    <div class="article-list" id="article-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPABASE_URL = "https://zpsbdymlofvzyskymagh.supabase.co";
const SUPABASE_KEY = "sb_publishable_6jazDy0kesZQBPSBaY77Rg_qMTM6Hze";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let aiConfig = JSON.parse(localStorage.getItem('aiConfig') || '{}');
let articles = [];
let currentTag = 'all';
let currentInputType = 'text';

const sidebar = document.getElementById("sidebar");
document.getElementById("menu-btn").onclick = () => sidebar.classList.add("open");
document.getElementById("close-sidebar").onclick = () => sidebar.classList.remove("open");

document.querySelectorAll(".input-tab").forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll(".input-tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".input-area").forEach(a => a.classList.remove("active"));
        tab.classList.add("active");
        currentInputType = tab.dataset.type;
        document.getElementById("area-" + currentInputType).classList.add("active");
    };
});

document.getElementById("input-image").onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const preview = document.getElementById("image-preview");
            preview.src = ev.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
};

// 配置 AI API
document.getElementById("settings-btn").onclick = () => {
    const url = prompt(
        "1. 请输入 API 地址：\n" +
        "（DeepSeek 填：https://api.deepseek.com/chat/completions\n" +
        "Gemini 填：https://generativelanguage.googleapis.com/v1beta/openai/chat/completions）\n" +
        "留空则使用免费翻译", aiConfig.url || "");
    if (url === null) return;
    
    const key = prompt("2. 请输入 API Key：", aiConfig.key || "");
    if (key === null) return;
    
    const model = prompt("3. 请输入模型名称：\n（DeepSeek 填 deepseek-chat\nGemini 填 gemini-1.5-flash）", aiConfig.model || "deepseek-chat");
    if (model === null) return;
    
    if (url && key) {
        aiConfig = { url, key, model };
        localStorage.setItem('aiConfig', JSON.stringify(aiConfig));
        alert("AI 配置已保存！重新翻译即可生效。");
    } else {
        localStorage.removeItem('aiConfig');
        aiConfig = {};
        alert("已切换为免费翻译模式（免费模式限制多，建议配置 AI）。");
    }
};

document.getElementById("translate-btn").onclick = async function() {
    const statusMsg = document.getElementById("status-msg");
    const resultCard = document.getElementById("result-card");
    const originalTextEl = document.getElementById("result-original");
    const translatedTextEl = document.getElementById("result-translated");
    
    let textToTranslate = "";
    this.disabled = true;
    statusMsg.textContent = "正在获取文本...";

    try {
        if (currentInputType === 'text') {
            textToTranslate = document.getElementById("input-text").value.trim();
            if (!textToTranslate) throw new Error("请输入需要翻译的文本");
        } 
        else if (currentInputType === 'url') {
            const url = document.getElementById("input-url").value.trim();
            if (!url) throw new Error("请输入网址");
            
            // 使用更稳定的 CORS 代理抓取网页
            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
            
            const res = await fetch(proxyUrl);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            
            // 尝试获取主要文章内容
            textToTranslate = doc.body.innerText.replace(/\s+/g, ' ').trim().substring(0, 5000);
            if (!textToTranslate) throw new Error("无法从该网页提取文本");
        }
        else if (currentInputType === 'image') {
            const file = document.getElementById("input-image").files[0];
            if (!file) throw new Error("请先选择图片");
            statusMsg.textContent = "正在识别图片中的文字 (OCR)...";
            
            // 加载韩文和英文语言包
            const worker = await Tesseract.createWorker('kor+eng');
            
            const ret = await worker.recognize(file);
            textToTranslate = ret.data.text.trim();
            await worker.terminate();
            if (!textToTranslate) throw new Error("图片中未识别到文字");
        }
        else if (currentInputType === 'file') {
            const file = document.getElementById("input-file").files[0];
            if (!file) throw new Error("请先选择文件");
            textToTranslate = await file.text();
        }

        if (!textToTranslate) throw new Error("获取到的文本为空");
        originalTextEl.textContent = textToTranslate;
        statusMsg.textContent = "正在翻译...";

        let translatedText = "";
        
        // 使用配置的 AI 接口
        if (aiConfig.url && aiConfig.key && aiConfig.model) {
            statusMsg.textContent = "正在通过 AI 翻译...";
            const response = await fetch(aiConfig.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${aiConfig.key}` },
                body: JSON.stringify({
                    model: aiConfig.model,
                    messages: [
                        { role: "system", content: "你是一个专业的翻译助手。请将用户提供的文本翻译成流畅自然的中文，只需输出翻译结果，不要添加任何解释。" },
                        { role: "user", content: textToTranslate }
                    ]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error("AI 接口报错: " + data.error.message);
            translatedText = data.choices[0].message.content;
        } else {
            // 备用：免费翻译接口
            statusMsg.textContent = "正在通过免费接口翻译（限制较多）...";
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textToTranslate)}&langpair=auto|zh-CN`);
            const data = await response.json();
            if (data.responseStatus !== 200) throw new Error("免费翻译失败: " + data.responseDetails);
            translatedText = data.responseData.translatedText;
        }

        translatedTextEl.textContent = translatedText;
        resultCard.style.display = "block";
        statusMsg.textContent = "翻译完成！";
        resultCard.scrollIntoView({ behavior: 'smooth' });

    } catch (err) {
        alert("出错啦：" + err.message);
        statusMsg.textContent = "";
    } finally {
        this.disabled = false;
    }
};

document.getElementById("clear-result-btn").onclick = () => {
    document.getElementById("result-card").style.display = "none";
    document.getElementById("result-original").textContent = "";
    document.getElementById("result-translated").textContent = "";
    document.getElementById("save-tags").value = "";
    document.getElementById("status-msg").textContent = "";
};

document.getElementById("save-article-btn").onclick = async function() {
    const original = document.getElementById("result-original").textContent;
    const translated = document.getElementById("result-translated").textContent;
    const tags = document.getElementById("save-tags").value.trim();
    if (!translated) return alert("没有可保存的翻译内容");
    this.disabled = true; this.textContent = "保存中...";
    const title = translated.substring(0, 20) + (translated.length > 20 ? "..." : "");
    const { error } = await supabaseClient.from("articles").insert({
        id: Date.now().toString(36), title: title, original_text: original, translated_text: translated, tags: tags
    });
    if (error) { alert("保存失败：" + error.message); } 
    else {
        alert("保存成功！");
        document.getElementById("clear-result-btn").click();
        await loadArticles();
    }
    this.disabled = false; this.textContent = "保存到收藏夹";
};

async function loadArticles() {
    const { data, error } = await supabaseClient.from("articles").select("*").order("created_at", { ascending: false });
    if (error) { console.error(error); return; }
    articles = data || [];
    renderTags();
    renderArticles();
}

function renderTags() {
    const tagListEl = document.getElementById("tag-list");
    const allTags = new Set();
    articles.forEach(a => { if (a.tags) a.tags.split(',').forEach(t => allTags.add(t.trim())); });
    let html = `<li class="tag-item ${currentTag === 'all' ? 'active' : ''}" data-tag="all">📚 全部文章</li>`;
    allTags.forEach(tag => { html += `<li class="tag-item ${currentTag === tag ? 'active' : ''}" data-tag="${tag}">🏷️ ${tag}</li>`; });
    tagListEl.innerHTML = html;
    document.querySelectorAll(".tag-item").forEach(item => {
        item.onclick = () => {
            currentTag = item.dataset.tag;
            document.getElementById("page-title").textContent = currentTag === 'all' ? "全部文章" : `标签: ${currentTag}`;
            renderTags(); renderArticles(); sidebar.classList.remove("open");
        };
    });
}

function renderArticles() {
    const list = document.getElementById("article-list");
    let filtered = articles;
    if (currentTag !== 'all') { filtered = articles.filter(a => a.tags && a.tags.includes(currentTag)); }
    if (filtered.length === 0) { list.innerHTML = `<div class="empty-tip">还没有保存的文章，快去翻译一篇吧 ♡</div>`; return; }
    list.innerHTML = filtered.map(a => `
        <div class="article-item">
            <div class="title">${escapeHTML(a.title)}</div>
            <div class="tags">${a.tags ? a.tags.split(',').map(t => `<span class="tag">${escapeHTML(t.trim())}</span>`).join('') : ''}</div>
            <div class="translated-text">${escapeHTML(a.translated_text)}</div>
            <div class="actions"><button class="btn btn-danger btn-sm" onclick="deleteArticle('${a.id}')">删除</button></div>
        </div>
    `).join("");
}

function escapeHTML(text) { return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function deleteArticle(id) {
    if (!confirm("确定要删除这篇文章吗？")) return;
    const { error } = await supabaseClient.from("articles").delete().eq("id", id);
    if (error) { alert("删除失败：" + error.message); return; }
    await loadArticles();
}

loadArticles();
</script>
</body>
</html>
